# ============================================================
# Пример локальных переопределений
#
# Скопировать в docker-compose.override.yml — он закрыт .gitignore и
# подхватывается docker compose автоматически.
#
# Здесь держат то, что относится к конкретной машине: открытые для
# отладки порты, монтирование исходников, другие уровни логирования.
# В основной docker-compose.yml это попадать не должно.
# ============================================================

services:
  postgres:
    # Порт базы наружу — только для отладки с хоста.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__MinimumLevel__Default: Debug
