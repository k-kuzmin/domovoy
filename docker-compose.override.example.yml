# ============================================================
# Пример локальных переопределений
#
# Скопировать в docker-compose.override.yml — он закрыт .gitignore и
# подхватывается docker compose автоматически.
#
# Здесь держат то, что относится к конкретной машине: открытые для
# отладки порты, монтирование исходников, другие уровни логирования.
# В основной docker-compose.yml это попадать не должно.
# ============================================================

services:
  postgres:
    # Порт базы — только для отладки с хоста и только на loopback: на всех
    # интерфейсах база открылась бы ЛВС в обход сети db (запись 0027).
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__MinimumLevel__Default: Debug

  # Home Assistant поднимается под профилем ha: docker compose --profile ha up -d.
  # USB-координатор (Zigbee, Z-Wave) пробрасывается в контейнер здесь, а не
  # в основном файле: путь устройства свой у каждой машины. Путь ниже —
  # плейсхолдер; на Linux устойчивое имя лежит в /dev/serial/by-id/.
  # Под Windows контейнер напрямую USB-устройств хоста не видит.
  #
  # homeassistant:
  #   devices:
  #     - /dev/serial/by-id/<имя-координатора>:/dev/ttyUSB0
