# ============================================================
# Домовой — конфигурация gitleaks
#
# Основной рубеж защиты (ТЗ REPO-1): срабатывает в pre-commit
# хуке до попадания данных в историю. Дублируется в CI (REPO-2).
#
# Помимо стандартных правил провайдеров закрывает специфику
# проекта: токен Home Assistant, ключи российских LLM-провайдеров,
# топик ntfy, приватные адреса и реальные имена хостов (ТЗ 5.1.3).
#
# Запуск вручную:
#   gitleaks git --staged --redact --no-banner   # то, что коммитится
#   gitleaks git --redact --no-banner            # вся история
#   gitleaks dir . --redact --no-banner          # рабочий каталог
# ============================================================

title = "Domovoy gitleaks config"

[extend]
# Наследуем правила на известных провайдеров (AWS, GitHub, OpenAI,
# Slack и прочие). Свои правила — только на то, чего в наборе по
# умолчанию нет.
useDefault = true

# ------------------------------------------------------------
# Токен Home Assistant (FR-HA-2)
#
# Long-lived access token — это JWT: три сегмента base64url через
# точку, суммарно 180+ символов. Утечка даёт полный контроль над
# домом, поэтому правило стоит первым.
# ------------------------------------------------------------
[[rules]]
id = "domovoy-ha-long-lived-token"
description = "Home Assistant long-lived access token (JWT)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}'''
keywords = ["eyj"]

# ------------------------------------------------------------
# Ключи GigaChat (ТЗ 3: основной LLM-провайдер)
#
# Authorization key — base64 от "client_id:client_secret", client
# id и secret — UUID. Правило ловит присваивание значения ключу с
# характерным именем, а не форму значения: UUID сам по себе не
# секрет и встречается в коде легально.
# ------------------------------------------------------------
[[rules]]
id = "domovoy-gigachat-credentials"
description = "Учётные данные GigaChat (authorization key, client id, client secret)"
#
# Между именем провайдера и параметром допускается разрыв: в YAML и
# JSON они лежат на разных строках (gigachat: / client_secret:), и
# правило, требующее смежности, такую форму пропускает.
regex = '''(?i)\b(?:gigachat|sber)\b[\s\S]{0,200}?\b(?:auth(?:orization)?[_.-]?key|api[_.-]?key|client[_.-]?(?:id|secret)|access[_.-]?token|secret|token)\b["']?\s*[:=]\s*["']?([A-Za-z0-9+/=_-]{16,})'''
secretGroup = 1
keywords = ["gigachat", "sber"]

# ------------------------------------------------------------
# Ключи Yandex Cloud (ТЗ 3: резервный LLM-провайдер YandexGPT)
#
# Форматы задокументированы и опознаются по префиксу:
#   AQVN... — API-ключ сервисного аккаунта
#   t1....  — IAM-токен
#   y0_...  — OAuth-токен
# ------------------------------------------------------------
[[rules]]
id = "domovoy-yandex-cloud-key"
description = "Ключ или токен Yandex Cloud (API key, IAM, OAuth)"
regex = '''\b(?:AQVN[A-Za-z0-9_-]{30,}|t1\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{50,}|y0_[A-Za-z0-9_-]{40,})\b'''
keywords = ["aqvn", "t1.", "y0_"]

# ------------------------------------------------------------
# Топик ntfy (ТЗ 5.1.3, FR-PUSH-1)
#
# Функционально это пароль: знающий имя топика читает уведомления
# и отправляет свои. Значение — случайная строка, по форме от
# любого идентификатора не отличается. Поэтому правило смотрит на
# ИМЯ параметра, а не на форму значения: правило на «строку
# достаточной энтропии» срабатывало бы на каждом втором файле.
# ------------------------------------------------------------
[[rules]]
id = "domovoy-ntfy-topic"
description = "Имя топика ntfy — функционально пароль"
#
# Две формы: слитная (NTFY_TOPIC=..., ntfy_topic: ...) и вложенная,
# где ntfy и topic разнесены по строкам YAML или JSON.
regex = '''(?i)\bntfy\b[\s\S]{0,200}?\b(?:topic|channel)\b["']?\s*[:=]\s*["']?([A-Za-z0-9_-]{6,})'''
secretGroup = 1
keywords = ["ntfy"]

# ------------------------------------------------------------
# Приватные адреса (ТЗ 5.1.3)
#
# Локальный адрес HA раскрывает топологию домашней сети.
# Октеты ограничены тремя цифрами, поэтому версии вида
# 10.0.19041 под правило не попадают.
# В примерах вместо реальных адресов используются имена сервисов
# Docker и диапазон RFC 5737 (192.0.2.0/24).
# ------------------------------------------------------------
[[rules]]
id = "domovoy-private-ipv4"
description = "Приватный IPv4-адрес — раскрывает топологию домашней сети"
regex = '''\b(?:10\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])|192\.168|172\.(?:1[6-9]|2[0-9]|3[01]))\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\b'''
keywords = ["10.", "192.168.", "172."]

# ------------------------------------------------------------
# MAC-адрес (ТЗ 5.1.3)
# ------------------------------------------------------------
[[rules]]
id = "domovoy-mac-address"
description = "MAC-адрес устройства"
regex = '''\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b'''
keywords = [":"]

  [[rules.allowlists]]
  description = "Зарезервированные и заведомо фиктивные адреса"
  regexTarget = "match"
  regexes = [
    '''(?i)^00:00:00:00:00:00$''',
    '''(?i)^ff:ff:ff:ff:ff:ff$''',
    '''(?i)^de:ad:be:ef:''',
  ]

# ------------------------------------------------------------
# Реальные имена хостов проекта (ТЗ 5.1.3, промпт 5.3)
#
# ТЗ 0 фиксирует домен проекта, ТЗ 5.1.3 запрещает имена хостов и
# поддоменов в репозитории. Противоречие решено в пользу запрета:
# в репозитории только плейсхолдеры example.com. Правило делает
# запрет проверяемым, а не оставляет его на память разработчика.
# ------------------------------------------------------------
[[rules]]
id = "domovoy-real-hostname"
description = "Реальный домен или поддомен проекта вместо плейсхолдера"
regex = '''(?i)\b[a-z0-9-]{0,40}\.?domovoy\.(?:space|ru|com|dev|app)\b'''
keywords = ["domovoy."]

# ------------------------------------------------------------
# Локальные имена хостов домашней сети
# ------------------------------------------------------------
[[rules]]
id = "domovoy-local-hostname"
description = "Локальное имя хоста домашней сети (.local, .lan, .home, .internal)"
regex = '''(?i)\b[a-z0-9][a-z0-9-]{1,40}\.(?:local|lan|home|internal)\b'''
keywords = [".local", ".lan", ".home", ".internal"]

  [[rules.allowlists]]
  description = "Служебные имена файлов и настроек, не относящиеся к домашней сети"
  regexTarget = "match"
  regexes = [
    '''(?i)^(?:appsettings|settings|properties|package|user|assembly|resources?|launchsettings|env|npmrc|terraform)\.local$''',
    '''(?i)^example\.(?:local|lan|home|internal)$''',
  ]

# ------------------------------------------------------------
# Токен Cloudflare Tunnel (AR-1)
# ------------------------------------------------------------
[[rules]]
id = "domovoy-cloudflare-tunnel-token"
description = "Токен или credentials Cloudflare Tunnel"
regex = '''(?i)\b(?:cloudflared?|tunnel)[_.-]?(?:token|secret|credentials?)\b["']?\s*[:=]\s*["']?([A-Za-z0-9+/=_-]{20,})'''
secretGroup = 1
keywords = ["cloudflare", "cloudflared", "tunnel"]

# ------------------------------------------------------------
# Пароль в строке подключения к базе данных
# ------------------------------------------------------------
[[rules]]
id = "domovoy-db-password"
description = "Пароль в строке подключения к базе данных"
regex = '''(?i)\b(?:password|pwd)\s*=\s*([^\s;"',{}$]{8,})'''
secretGroup = 1
keywords = ["password", "pwd"]

# ============================================================
# Глобальные исключения
# ============================================================

[[allowlists]]
description = "Плейсхолдеры и заведомо фиктивные значения. .example-файлы обязаны быть рабочими (ТЗ 5.1.3), поэтому содержат значения, по форме похожие на настоящие — они должны проходить проверку."
regexTarget = "match"
regexes = [
  '''^(?:<[^>]{1,60}>|\{\{?[A-Za-z0-9_.-]{1,60}\}?\}|\$\{?[A-Z0-9_]{1,60}\}?)$''',
  '''(?i)(?:example|placeholder|change[_-]?me|replace[_-]?me|your[_-]?|dummy|sample|redacted|xxxxx|0{8,}|not[_-]?set|fill[_-]?me|paste[_-]?)''',
  '''(?i)^(?:secret|password|passw0rd|token|key|apikey|api[_-]key|topic|value|string)$''',
]

[[allowlists]]
description = "Файлы, которые описывают сами правила поиска"
paths = [
  '''(?:^|/)\.gitleaks\.toml$''',
  '''(?:^|/)\.gitleaksignore$''',
  '''(?:^|/)\.gitignore$''',
  '''(?:^|/)\.dockerignore$''',
  '''(?:^|/)\.githooks/''',
]

[[allowlists]]
description = "Артефакты сборки и блокировки пакетов"
paths = [
  '''(?:^|/)(?:bin|obj|artifacts|node_modules)/''',
  '''(?:^|/)packages\.lock\.json$''',
]
