# ============================================================
# Домовой — базовый стек
#
# Поднимается на .env.example без правок (ТЗ 5.1.3):
#
#   cp .env.example .env
#   docker compose up -d --build --wait
#   curl -s http://localhost:18080/health
#
# По умолчанию поднимаются только Backend и база. Home Assistant
# объявлен здесь же, но под профилем ha (запись 0027): обычный
# docker compose up его образ не тянет, а с профилем он встаёт в общую
# сеть стека, и Backend находит его по имени сервиса из HA_BASE_URL:
#
#   docker compose --profile ha up -d
#
# faster-whisper и ntfy добавляются своими этапами (запись 0004).
#
# Локальные переопределения — docker-compose.override.yml, он закрыт
# .gitignore. Пример: docker-compose.override.example.yml.
# ============================================================

name: ${COMPOSE_PROJECT_NAME:-domovoy}

services:
  postgres:
    image: postgres:16-alpine
    # Автозапуск после перезагрузки машины обязателен (AR-5).
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Ускоряет инициализацию и делает сравнение строк предсказуемым
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Наружу порт не публикуется: к базе обращается только Backend.
    # Для отладки открывать через docker-compose.override.yml.
    expose:
      - '5432'
    # Своя сеть: Home Assistant с его сторонними интеграциями базу не
    # видит. internal не ставится — иначе не работает порт для отладки
    # из docker-compose.override.yml.
    networks: ['db']

  api:
    build:
      context: .
      dockerfile: src/Domovoy.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: '8080'

      # Двойное подчёркивание — разделитель уровней в конфигурации .NET.
      # Код читает IConfiguration и не знает, откуда пришло значение.
      ConnectionStrings__Domovoy: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      Ha__BaseUrl: ${HA_BASE_URL}
      Ha__Token: ${HA_TOKEN}
      Ha__EntityRegistryPath: config/entities.yaml

      Llm__BaseUrl: ${LLM_BASE_URL}
      Llm__ApiKey: ${LLM_API_KEY}
      Llm__Model: ${LLM_MODEL}
      Llm__Dialect: ${LLM_DIALECT}
      Llm__Proxy: ${LLM_PROXY}
      Llm__MonthlyTokenBudget: ${LLM_MONTHLY_TOKEN_BUDGET}

      Ntfy__BaseUrl: ${NTFY_BASE_URL}
      Ntfy__Topic: ${NTFY_TOPIC}

      Voice__SpeechToTextUrl: ${VOICE_STT_URL}
      Voice__TextToSpeechUrl: ${VOICE_TTS_URL}
      Voice__Language: ${VOICE_LANGUAGE}

      Proactivity__Enabled: ${PROACTIVITY_ENABLED}
      Proactivity__RulesPath: config/proactive-rules.yaml

      HomeProfile__Path: config/home-profile.md
      ResponseTemplates__Path: config/response-templates.yaml
    # default — к Home Assistant по имени сервиса и в интернет, db — к базе.
    networks: ['default', 'db']
    ports:
      - '${API_HTTP_PORT:-18080}:8080'
    volumes:
      # Реестр сущностей и профиль дома — только на чтение: содержимое
      # приватнее токенов, менять его изнутри контейнера незачем.
      - ./config:/app/config:ro
    healthcheck:
      # Анонимный /health: healthcheck контейнера не имеет токена
      # устройства и получить его не может.
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  homeassistant:
    # Точная версия, а не stable: стек на чистой машине воспроизводим.
    image: ghcr.io/home-assistant/home-assistant:2026.10.1
    # Только по явному запросу: без устройств HA ничем не управляет,
    # а образ тяжёлый (записи 0004 и 0027).
    profiles: ['ha']
    # Автозапуск после перезагрузки машины обязателен (AR-5).
    restart: unless-stopped
    volumes:
      # Именованный том вне рабочего дерева: в .storage HA лежат токены
      # и реальные entity_id, в git они попасть не могут.
      - homeassistant-config:/config
    # Веб-интерфейс публикуется на хост, чтобы он был доступен из
    # локальной сети. Наружу HA не выставляется (NFR-SEC-2): проброса
    # этого порта на роутере нет и быть не должно (запись 0027).
    ports:
      - '${HA_HTTP_PORT:-8123}:8123'

networks:
  db:

volumes:
  postgres-data:
  homeassistant-config:
