name: agent-plan

# Второй шаг цикла: план публикуется комментарием и ждёт апрува человека.
# Разделение «сначала план, потом код» существует ради одной вещи —
# несогласие с подходом стоит одного комментария, а не выброшенного PR.
on:
  issues:
    types: [labeled]

# Планирование только читает код и пишет комментарий с меткой.
permissions:
  contents: read
  issues: write

concurrency:
  group: agent-plan-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: План реализации
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ.
    #
    # Репозиторий публичный, и `issues` — событие, доступное постороннему.
    # Гейт стоит на авторе задачи (`github.event.issue.author_association`),
    # а не на `github.actor`: метку `agent/ready` ставит agent-triage через
    # AGENT_TOKEN, то есть актором оказывается владелец токена независимо
    # от того, чья это задача. Проверка актора пропустила бы ровно то, от
    # чего защищаемся, — чужую задачу, размеченную нашим же токеном.
    # Поставить метку вручную может только тот, у кого есть write-доступ.
    #
    # Проверка `github.event.label.name` обязательна: без неё план
    # переигрывался бы на каждой добавленной метке, включая собственную
    # `plan/proposed` — бесконечный платный цикл.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА. Основной режим работы — задачу ведёт человек из
    # Claude CLI, а эти процессы лежат выключенными (docs/pipeline.md).
    # Без переменной запуск не начинается вовсе: отсутствие секрета его не
    # останавливает — процесс стартовал бы и упал на шаге вызова модели,
    # засоряя историю красными прогонами. Включение цикла — установка
    # `vars.AGENT_LOOP_ENABLED = true` плюс два секрета, и ничего больше.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (
        github.event.label.name == 'agent/ready' &&
        github.event.issue.author_association == 'OWNER' &&
        !contains(github.event.issue.labels.*.name, 'agent/needs-human')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Составление плана
        id: plan
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Метку `agent/ready` ставит триаж через AGENT_TOKEN, то есть от
          # имени владельца, а не бота: списка допустимых ботов не нужно.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Репозиторий: ${{ github.repository }}
            Задача: #${{ github.event.issue.number }}

            Составь план реализации. Код не пиши: на этом шаге доступны
            только чтение и поиск, и это не ограничение инструмента, а суть
            шага — план обсуждается до того, как написана первая строка.

            Правила шага — `docs/rules/plan.md`: разделы плана и то, что
            делать, когда план составить нельзя. Прочитай файл целиком до того,
            как начнёшь: это источник, а не пересказ.

            Форма плана — `scripts/plan-schema.json`. Прочитай схему целиком и
            верни план полем `plan_json`: строкой, в которой лежит JSON по этой
            схеме. Человекочитаемый комментарий соберётся из структуры
            автоматикой, второго канала прозой нет — раздел, которому не нашлось
            поля, в опубликованный план не попадёт вовсе. Обязательные поля,
            допустимые значения и смысл каждого поля описаны в самой схеме.

            План проверяется детерминированным валидатором до публикации:
            несуществующий путь, путь вне границ задачи, защищённый путь без
            отметки, непокрытый пункт приёмки, существующий тест, выданный за
            новый, — всё это отказ, а не замечание на будущее.

            Правила проекта — `.claude/CLAUDE.md`, читай их из репозитория.
            Обязательны «Архитектура», «Границы работы агента», «Правила
            синхронизации», «Definition of Done».

            Раздел «Как устроено сейчас» требует прочитать существующий код.
            Как отбирать нужное в объёмном выводе — `docs/rules/reading.md`.

            Если задача не поддаётся планированию, верни blocked=true и объясни,
            чего не хватает. Остановка с объяснением — нормальный результат,
            догадка в плане — нет.

            Отвечай по-русски.
          claude_args: |
            # Планирование только читает: ни Edit, ни Write, ни Bash.
            --allowedTools 'Read,Glob,Grep'
            --max-turns 25
            # Обёртка остаётся той же по форме, что работала до этого:
            # строковое поле плюс blocked и blocked_reason. Схема плана в
            # аргумент не интерполируется — шаг читает её файлом.
            --json-schema '{"type":"object","properties":{"plan_json":{"type":"string","description":"Машиночитаемый план: строка с JSON по форме scripts/plan-schema.json. Поля, обязательность и допустимые значения берутся из схемы"},"blocked":{"type":"boolean","description":"План составить нельзя, нужен ответ человека"},"blocked_reason":{"type":"string","description":"Чего не хватает; пустая строка при blocked=false"}},"required":["plan_json","blocked","blocked_reason"]}'

      - name: Публикация плана
        env:
          # Шагу — штатный токен. PAT ниже лежит в окружении всего шага и
          # наследуется каждым дочерним процессом: поимённым префиксом сужен
          # радиус автоматической аутентификации `gh`, а не радиус окружения.
          # Штатным `GH_TOKEN` шага `gh` аутентифицируется по умолчанию; PAT
          # лежит под собственным именем, которого `gh` не читает вовсе, и
          # доезжает до него ровно там, где имя подставлено префиксом — в двух
          # командах. Инлайн `GH_TOKEN="${{ secrets.AGENT_TOKEN }}"` в теле
          # `run:` был бы хуже: секрет попал бы в текст скрипта.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT под собственным именем. Нужен он двум командам — комментарию с
          # планом и метке `plan/proposed`, — и по двум причинам сразу; обе
          # появились вместе с плановым кругом ревью (agent-review.yml, job
          # `plan-round` и `plan-correctness`):
          #
          # 1. Событие, вызванное штатным токеном, не создаёт запусков вовсе.
          #    `plan/proposed` от `GITHUB_TOKEN` не разбудила бы круг ничем, и
          #    автоматической связки «план опубликован — план отревьюен» не
          #    появилось бы: круг стартовал бы только на метке, поставленной
          #    руками.
          # 2. Комментарий от штатного токена приходит от `github-actions[bot]`,
          #    чей `authorAssociation` не равен `OWNER`. Плановый круг берёт
          #    предметом ревью последний комментарий владельца — выбирает его
          #    шаг `Предмет ревью — план` в agent-review.yml, и на комментарии
          #    от бота он падал бы, ничего не проверив, на каждой задаче.
          #
          # Под штатным токеном остаётся ветка «план не составлен» — её
          # `gh issue comment` отдельный (ниже, в блоке `blocked = true`), — и
          # обе `gh issue edit` с `agent/needs-clarification`: будить ими
          # некого. У ветки «валидатор не пропустил» своего комментария нет:
          # план и отчёт валидатора публикует общая строка ниже, то есть под
          # PAT. Это осознанно, а не недосмотр: уведи ту строку под штатный
          # токен — и комментарий непрошедшего валидатор плана придёт от бота,
          # а выборка предмета ревью `[.comments[] | select(OWNER)] | last`
          # разрешится в предыдущий, устаревший план.
          #
          # Побочный радиус двух команд назван и прослежен: под AGENT_TOKEN
          # события начнут порождать и метка, и сам комментарий с планом. У
          # события метки адресат один — плановый круг в agent-review, он и
          # ждёт `plan/proposed`. Остальные просыпаются впустую: agent-triage
          # требует `agent` (:55), agent-plan — `agent/ready` (:47),
          # agent-implement — `plan/approved` (:59); status-sync
          # (status-sync.yml:8-9) просыпается тоже, но `plan/proposed` в его
          # таблице статусов нет (status-sync.yml:121-126) — целевой статус он
          # считает по остальным меткам задачи и по этому событию карточку
          # никуда не переводит. Из потребителей события комментария оба
          # (agent-review, agent-fix) отсекаются конъюнктом
          # `github.event.issue.pull_request != null`.
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          # Текст написан моделью и в скрипт попадает только через
          # окружение: подстановка ${{ }} в тело `run:` дала бы содержимому
          # задачи возможность выполнить команду.
          PLAN: ${{ steps.plan.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ -z "$PLAN" ]; then
            echo '::error::Шаг планирования не вернул структурированный результат.'
            exit 1
          fi

          blocked=$(printf '%s' "$PLAN" | jq -r '.blocked')

          if [ "$blocked" = 'true' ]; then
            {
              echo '## План не составлен'
              echo
              printf '%s' "$PLAN" | jq -r '.blocked_reason'
            } > body.md
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md
            gh issue edit "$ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label 'agent/needs-clarification' \
              --remove-label 'agent/ready'
            exit 0
          fi

          printf '%s' "$PLAN" | jq -r '.plan_json' > plan.json

          if ! jq -e . plan.json >/dev/null 2>&1; then
            echo '::error::Поле plan_json не разбирается как JSON.'
            exit 1
          fi

          # Валидатор до публикации и до апрува. Красный результат публикуется
          # вместе с планом: читать непрошедший план полезно, согласовывать —
          # нельзя.
          set +e
          bash scripts/plan.sh validate plan.json > validation.txt 2>&1
          validation_status=$?
          bash scripts/plan.sh render plan.json > rendered.md 2>&1
          render_status=$?
          set -e

          if [ "$render_status" -ne 0 ]; then
            echo '::error::Рендер плана отказал — см. вывод ниже.'
            cat rendered.md
            exit 1
          fi

          {
            echo '## План реализации'
            echo
            cat rendered.md
            echo
            echo '---'
            echo

            if [ "$validation_status" -ne 0 ]; then
              echo '### Валидатор плана не пропустил план'
              echo
              echo '```'
              cat validation.txt
              echo '```'
              echo
              echo 'Метка `plan/proposed` не поставлена: согласовывать план с'
              echo 'этими расхождениями рано. Правки — новым планом.'
              echo
            fi

            echo '<details>'
            echo '<summary>Машиночитаемая форма плана</summary>'
            echo
            echo '```json'
            cat plan.json
            echo '```'
            echo
            echo '</details>'
            echo

            if [ "$validation_status" -eq 0 ]; then
              # Кавычки у разделителя обязательны: внутри обратные кавычки
              # markdown, и без них shell попытается их выполнить.
              cat <<'FOOTER'
          Согласны — поставьте метку `plan/approved`, реализация начнётся сама.
          Не согласны — напишите в комментарии, что менять, и снимите
          `plan/proposed`: план будет составлен заново.
          FOOTER
            fi
          } > body.md

          # Поимённый префикс, а не токен всего шага: под PAT идут ровно две
          # команды — эта и постановка `plan/proposed` в конце. Автор
          # комментария решает, найдёт ли плановый круг предмет ревью. Строка
          # общая для обеих веток: непрошедший валидатор план публикуется ею
          # же и тоже от владельца — иначе выборка предмета ревью нашла бы не
          # его, а предыдущий план (причина целиком — в комментарии к `env`).
          GH_TOKEN="$AGENT_TOKEN" gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md

          if [ "$validation_status" -ne 0 ]; then
            gh issue edit "$ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label 'agent/needs-clarification' \
              --remove-label 'agent/ready'
            exit 1
          fi

          # Вторая и последняя команда под PAT: событие от штатного токена
          # запусков не создаёт, и метка не разбудила бы плановый круг.
          GH_TOKEN="$AGENT_TOKEN" gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label 'plan/proposed'
