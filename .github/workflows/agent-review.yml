name: agent-review

# Четвёртый шаг цикла: два независимых ревью одного PR.
# Независимых буквально — это два разных job с разными промптами. Ревьюер,
# которого попросили посмотреть «и корректность, и безопасность»,
# заканчивает список после третьего пункта; два прохода такого не делают.
on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]
  # Третье событие — вход планового круга: предмет ревью здесь не дифф, а
  # план, и он живёт комментарием к задаче, а не PR. Метку `plan/proposed`
  # ставит agent-plan через AGENT_TOKEN — событие от штатного токена запусков
  # не создаёт вовсе (docs/pipeline.md, раздел «AGENT_TOKEN»).
  #
  # Плата за третье событие — пустые запуски: любая метка любой задачи
  # репозитория теперь будит agent-review, и он отсекается гейтом. Одна
  # публикация плана даёт шесть таких запусков: четыре от метки
  # (agent-triage.yml:55 отсекает на имени метки `agent`, agent-plan.yml:47 —
  # на `agent/ready`, agent-implement.yml:59 — на `plan/approved`, плановая
  # половина ниже — на `plan/proposed`) и два от комментария с планом
  # (agent-review.yml:11 и agent-fix.yml:23, оба отсекаются конъюнктом
  # `github.event.issue.pull_request != null`). Вызова модели в пропущенном
  # запуске нет, платы тоже: шесть строк в истории — не поломка.
  issues:
    types: [labeled]

# Ревью читает код и пишет комментарий к PR. Метку `review/N` ставит job
# `round` — тем же `pull-requests: write`, которым agent-fix ставит `fix/N`.
# contents: write не нужен: правка кода — это agent-fix, а не ревью.
#
# Плановой половине нужна запись в issues, а не в PR. Права ей выданы блоком
# `permissions` на уровне её двух job: файловый уровень расширил бы права и
# трём job PR-половины, которым запись в issues не нужна.
permissions:
  contents: read
  pull-requests: write

concurrency:
  # Номера issue и PR в GitHub общие, и на событии `issues` номер приезжает
  # тем же полем, что у комментария: плановая половина попадает в ту же
  # группу и конкуренции с PR-половиной не создаёт — предмет у них один и тот
  # же объект.
  group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # Отмена на середине съедает круг. Метка `review/N` ставится job `round` ДО
  # ревью — иначе она теряется при смерти раннера и потолок не достигается
  # никогда. Обратная сторона: запуск, отменённый между `round` и ревью,
  # круг потратил, а замечаний не дал. Две таких отмены — и PR получает
  # `agent/needs-human`, ни разу не отревьюенный.
  #
  # Одновременные запуски здесь не редкость: `agent-fix` сам пишет `/review`
  # после починки (запись 0016), и человек, снимающий черновик, легко
  # попадает в то же окно. Поэтому запуск доводится до конца, а повторный
  # ждёт — так же, как в `agent-fix.yml`, где счётчик появился раньше.
  cancel-in-progress: false

jobs:
  round:
    name: Круг ревью
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stop: ${{ steps.count.outputs.stop }}
      round: ${{ steps.count.outputs.round }}
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ. Дословно то же условие, что на `correctness`
    # и `security`; обоснование — в комментарии там. Этот job первый, и
    # пропуск его по гейту пропускает оба ревью через `needs:` — но условие
    # продублировано и там: гейт, стоящий в одном месте, снимается одной
    # правкой.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА. Основной режим работы — задачу ведёт человек из
    # Claude CLI, а эти процессы лежат выключенными (docs/pipeline.md).
    # Без переменной запуск не начинается вовсе.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.actor == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/review')
        )
      )
    steps:
      - name: Номер круга
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail

          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')

          # Счётчик живёт в метках, а не в состоянии запуска: запуск
          # одноразовый, метка переживает перезапуск и видна человеку.
          #
          # Кругов два, и считаются они отдельно от `fix/1..3`: падение CI и
          # замечание ревьюера — разные поводы, и общий счётчик их смешивал
          # (запись 0016).
          round=1
          for n in 1 2; do
            if printf '%s\n' "$labels" | grep -qx "review/$n"; then
              round=$((n + 1))
            fi
          done

          stop=false
          if [ "$round" -gt 2 ]; then
            stop=true
          fi

          {
            echo "round=$round"
            echo "stop=$stop"
          } >> "$GITHUB_OUTPUT"
          echo "Круг ревью: $round, остановка: $stop"

      - name: Отметка круга
        # Метка ставится ДО ревью, а не после: она считает круги, а не
        # успехи. Поставленная после, она теряется, если раннер умер посреди
        # ревью, — и потолок не будет достигнут никогда, а круги станут
        # неограниченными и платными. Ровно та же причина, что у `fix/N`.
        if: steps.count.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          ROUND: ${{ steps.count.outputs.round }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "review/$ROUND"

      - name: Два круга исчерпаны — дальше человек
        if: steps.count.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          {
            echo '## Ревью остановлено'
            echo
            # Кавычки у разделителя обязательны: внутри обратные кавычки
            # markdown, и без них shell попытается их выполнить.
            cat <<'TEXT'
          Два круга (`review/1`, `review/2`) не сошлись. Третий круг того же
          ревьюера по тому же коду — не ревью, а его имитация, поэтому цикл
          остановлен.
          TEXT
            echo
            echo 'Дальше нужен человек: посмотреть замечания предыдущих кругов'
            echo 'и решить, чинить или мержить.'
          } > body.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label 'agent/needs-human'

  correctness:
    name: Ревью — корректность
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: round
    outputs:
      verdict: ${{ steps.publish.outputs.verdict }}
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ. То же условие стоит на job `security`;
    # при правке менять оба.
    #
    # `issue_comment` — самое опасное событие в публичном репозитории:
    # оно всегда исполняется в контексте базового репозитория и с доступом
    # к секретам. Без гейта любой посторонний, написавший `/review` под
    # любой issue, запускал бы оплаченный вызов модели за счёт владельца.
    # `github.event.comment.author_association == 'OWNER'` — проверка автора
    # именно того комментария, который запустил запуск.
    #
    # Для `pull_request` проверок две: `github.actor` — это тот, кто снял с
    # PR черновик (событие `ready_for_review` может породить только человек
    # с write-доступом), а сравнение head-репозитория отсекает PR из форков,
    # которым секреты не положены в принципе.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА. Основной режим работы — задачу ведёт человек из
    # Claude CLI, а эти процессы лежат выключенными (docs/pipeline.md).
    # Без переменной запуск не начинается вовсе: отсутствие секрета его не
    # останавливает — процесс стартовал бы и упал на шаге вызова модели,
    # засоряя историю красными прогонами. Включение цикла — установка
    # `vars.AGENT_LOOP_ENABLED = true` плюс два секрета, и ничего больше.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.actor == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/review')
        )
      ) &&
      needs.round.outputs.stop == 'false'
    steps:
      - name: Checkout ветки PR
        uses: actions/checkout@v7
        with:
          # refs/pull/N/head одинаково работает для обоих событий: у
          # `issue_comment` контекста ветки нет вовсе.
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - name: Проверка корректности
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Репозиторий: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number || github.event.issue.number }}

            Ты ревьюишь корректность изменения. Код не правь: доступны только
            чтение, поиск и просмотр диффа (`gh pr diff`). Замечание — это текст,
            а не коммит.

            Правила шага — `docs/rules/review-correctness.md`: на что смотреть.
            Уровни замечаний и требования к их формулировке — `docs/rules/README.md`.
            Прочитай оба файла целиком до того, как начнёшь: это источник, а не
            пересказ.

            Правила проекта — `.claude/CLAUDE.md`, читай их из репозитория.
            Обязательны «Архитектура», «Definition of Done», «Запрещённые способы
            „починить“ сборку», «Правила синхронизации».

            Дифф и логи бывают длинными. Как читать их отбором, а не целиком, —
            `docs/rules/reading.md`.

            Верни verdict, blocker_count и findings_markdown — готовый текст
            комментария. Отвечай по-русски.
          claude_args: |
            # Только чтение и дифф: ревью не правит код. Кавычки
            # обязательны: список разбирается shell-подобным токенизатором,
            # и без них скобки в `Bash(...)` съедаются как управляющие
            # символы — вместо ограничения получится мусор.
            # `gh issue view` — только у корректности: пункт про сверку с
            # утверждённым планом требует прочитать комментарий с планом, а
            # он лежит в issue, а не в PR.
            --allowedTools 'Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)'
            --max-turns 30
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"],"description":"Итог ревью"},"blocker_count":{"type":"integer","minimum":0,"description":"Число замечаний уровня blocker"},"findings_markdown":{"type":"string","description":"Готовый markdown со списком замечаний"}},"required":["verdict","blocker_count","findings_markdown"]}'

      - name: Публикация замечаний
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SECTION: Корректность
          # Текст написан моделью по содержимому PR. В скрипт он попадает
          # только через окружение: подстановка ${{ }} прямо в `run:`
          # позволила бы содержимому диффа выполнить команду.
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ -z "$RESULT" ]; then
            echo '::error::Ревью не вернуло структурированный результат.'
            exit 1
          fi

          verdict=$(printf '%s' "$RESULT" | jq -r '.verdict')
          blockers=$(printf '%s' "$RESULT" | jq -r '.blocker_count')

          # Вердикт наружу: по нему job `fix-request` решает, запускать ли
          # починку. Значение пришло от модели, поэтому в вывод оно попадает
          # как есть, а сравнение со строкой делает GitHub, не shell.
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "## Ревью: $SECTION"
            echo
            echo "Итог: **$verdict**, блокирующих замечаний: $blockers."
            echo
            printf '%s' "$RESULT" | jq -r '.findings_markdown'
          } > body.md

          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md

  security:
    name: Ревью — безопасность
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: round
    outputs:
      verdict: ${{ steps.publish.outputs.verdict }}
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ. Дословно то же условие, что на job
    # `correctness`; обоснование — в комментарии там. Условие продублировано,
    # а не вынесено: `if` на уровне job — единственное место, где запуск
    # можно не начать вовсе, а YAML-якоря GitHub Actions не поддерживает.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА. Основной режим работы — задачу ведёт человек из
    # Claude CLI, а эти процессы лежат выключенными (docs/pipeline.md).
    # Без переменной запуск не начинается вовсе: отсутствие секрета его не
    # останавливает — процесс стартовал бы и упал на шаге вызова модели,
    # засоряя историю красными прогонами. Включение цикла — установка
    # `vars.AGENT_LOOP_ENABLED = true` плюс два секрета, и ничего больше.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.actor == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/review')
        )
      ) &&
      needs.round.outputs.stop == 'false'
    steps:
      - name: Checkout ветки PR
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - name: Проверка безопасности
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Репозиторий: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number || github.event.issue.number }}

            Ты ревьюишь безопасность изменения. Код не правь: доступны только
            чтение, поиск и просмотр диффа (`gh pr diff`).

            Правила шага — `docs/rules/review-security.md`: на что смотреть в
            диффе и что в замечания не идёт. Уровни замечаний и требования к их
            формулировке — `docs/rules/README.md`. Прочитай оба файла целиком до
            того, как начнёшь: это источник, а не пересказ.

            Источник самих правил — раздел «Безопасность — правила уровня „нельзя
            никогда“» в `.claude/CLAUDE.md`. Прочитай его целиком.

            Дифф бывает длинным. Как искать в нём по признакам, а не читать
            подряд, — `docs/rules/reading.md`.

            Верни verdict, blocker_count и findings_markdown — готовый текст
            комментария. Отвечай по-русски.
          claude_args: |
            # Только чтение и дифф: ревью не правит код. Кавычки
            # обязательны: список разбирается shell-подобным токенизатором,
            # и без них скобки в `Bash(...)` съедаются как управляющие
            # символы — вместо ограничения получится мусор.
            --allowedTools 'Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*)'
            --max-turns 30
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"],"description":"Итог ревью"},"blocker_count":{"type":"integer","minimum":0,"description":"Число замечаний уровня blocker"},"findings_markdown":{"type":"string","description":"Готовый markdown со списком замечаний"}},"required":["verdict","blocker_count","findings_markdown"]}'

      - name: Публикация замечаний
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SECTION: Безопасность
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ -z "$RESULT" ]; then
            echo '::error::Ревью не вернуло структурированный результат.'
            exit 1
          fi

          verdict=$(printf '%s' "$RESULT" | jq -r '.verdict')
          blockers=$(printf '%s' "$RESULT" | jq -r '.blocker_count')

          # Вердикт наружу: по нему job `fix-request` решает, запускать ли
          # починку. Значение пришло от модели, поэтому в вывод оно попадает
          # как есть, а сравнение со строкой делает GitHub, не shell.
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "## Ревью: $SECTION"
            echo
            echo "Итог: **$verdict**, блокирующих замечаний: $blockers."
            echo
            printf '%s' "$RESULT" | jq -r '.findings_markdown'
          } > body.md

          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md

  fix-request:
    name: Замечания уходят в починку
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [correctness, security]
    # ПРЯМОЕ ПЛЕЧО ЦИКЛА.
    #
    # Вердикт `changes_requested` сам по себе не порождал ничего: ревью
    # печатало замечания и на этом заканчивалось. Починку ждал `agent-fix` по
    # событию `pull_request_review`, а оно недостижимо — `gh pr review
    # --request-changes` в собственном PR GitHub отвечает 422 «Can not request
    # changes on your own pull request», и автор PR здесь всегда владелец:
    # ветку пушит `agent-implement` его же токеном. Проверено вызовом API
    # (запись 0017).
    #
    # Поэтому вход — комментарий `/fix`, симметрично тому, как `agent-fix`
    # просит повторное ревью комментарием `/review`.
    #
    # `always()`: второй job мог не дойти, но вердикт первого от этого не
    # перестаёт требовать починки. Пропущенный job даёт пустой output, и
    # условие на нём не срабатывает — стоп-круг починку не запускает.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА стоит и здесь, хотя при выключенном цикле оба ревью
    # пропускаются и вердикта не будет: условие, выведенное из чужого
    # состояния, перестаёт держать, как только чужое состояние поменяли.
    if: >-
      always() &&
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (
        needs.correctness.outputs.verdict == 'changes_requested' ||
        needs.security.outputs.verdict == 'changes_requested'
      )
    steps:
      - name: Запрос починки
        env:
          # AGENT_TOKEN обязателен: комментарий от штатного GITHUB_TOKEN не
          # порождает событий, и `agent-fix` его не увидит. Та же причина, по
          # которой PAT нужен `agent-implement` и `agent-triage`.
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          CORRECTNESS: ${{ needs.correctness.outputs.verdict }}
          SECURITY: ${{ needs.security.outputs.verdict }}
        run: |
          set -euo pipefail

          # Один комментарий на оба ревью. Два запустили бы две починки одной
          # ветки: вторая потратила бы попытку `fix/N` на уже исправленное.
          {
            echo '/fix'
            echo
            echo "Корректность: ${CORRECTNESS:-не выполнялось}."
            echo "Безопасность: ${SECURITY:-не выполнялось}."
            echo
            echo 'Замечания — в комментариях выше.'
          } > body.md

          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md

  # ------------------------------------------------------------------
  # ПЛАНОВАЯ ПОЛОВИНА. Предмет ревью — план, а не дифф.
  #
  # Она целиком параллельна PR-половине и не пересекается с ней ничем: гейты
  # трёх job выше требуют `event_name` равным `pull_request` или
  # `issue_comment` и на событии `issues` ложны, поэтому на метке они
  # пропускаются сами, без дополнительных условий. Обратное тоже верно.
  #
  # Почему здесь, а не отдельным файлом: scripts/rules-sync.sh выводит шаг из
  # имени файла потребителя. Для agent-plan-review.yml шагом оказался бы
  # «plan-review», и сверка потребовала бы ссылку на docs/rules/plan.md,
  # никогда не заметив пропажу ссылки на review-correctness.md — то есть на
  # настоящие правила этого шага.
  # ------------------------------------------------------------------
  plan-round:
    name: Круг ревью плана
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Права плановой половины — на уровне job: блок перекрывает файловый
    # целиком, а не дополняет его. Записи в PR здесь не нужно, чтения кода —
    # нужно: job запускает скрипт из репозитория.
    permissions:
      contents: read
      issues: write
    outputs:
      stop: ${{ steps.count.outputs.stop }}
      round: ${{ steps.count.outputs.round }}
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ. Дословно то же условие стоит на
    # `plan-correctness`; при правке менять оба — гейт, стоящий в одном месте,
    # снимается одной правкой.
    #
    # Первые четыре конъюнкта дословно повторяют agent-plan.yml:44-50, и по
    # той же причине: `issues` — событие, доступное постороннему, гейт стоит
    # на авторе задачи, а не на `github.actor`. Метку ставит agent-plan через
    # AGENT_TOKEN, то есть актором оказывается владелец токена независимо от
    # того, чья это задача; проверка актора пропустила бы ровно то, от чего
    # защищаемся. Поставить метку вручную может только обладатель
    # write-доступа.
    #
    # Проверка `github.event.label.name` обязательна ещё и против
    # зацикливания: без неё круг переигрывался бы на каждой добавленной метке,
    # включая собственную `plan-review/N`. Второй упор против того же —
    # штатный токен на своих метках: события от него запусков не создают.
    # Каждый упор по отдельности снимается одной правкой, поэтому их два.
    #
    # Пятый конъюнкт добавлен сверх agent-plan.yml: тот обслуживает одно
    # событие, а этот файл — три, и задача, отданная человеку, не должна
    # будить оплаченный вызов модели.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА. Основной режим работы — задачу ведёт человек из
    # Claude CLI, а эти процессы лежат выключенными (docs/pipeline.md).
    # Без переменной запуск не начинается вовсе.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      github.event_name == 'issues' &&
      github.event.label.name == 'plan/proposed' &&
      github.event.issue.author_association == 'OWNER' &&
      !contains(github.event.issue.labels.*.name, 'agent/needs-human')
    steps:
      - name: Checkout
        # У PR-половины job `round` чекаута нет вовсе: он обходится одним
        # `gh pr view`. Здесь арифметика вынесена в скрипт репозитория, и без
        # чекаута шаг ниже упал бы на отсутствующем файле.
        uses: actions/checkout@v7

      - name: Номер круга
        id: count
        env:
          # Штатного токена достаточно: здесь только чтение меток.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Счётчик живёт в метках, а не в состоянии запуска: запуск
          # одноразовый, метка переживает перезапуск и видна человеку.
          #
          # Метки свои — `plan-review/1..2`, а не `review/1..2`: те заняты
          # семантикой PR, ставятся через `gh pr edit` и читаются
          # `gh pr view`. Общий счётчик смешал бы круги плана и круги диффа
          # ровно так, как запись 0016 запрещает смешивать ревью с починкой.
          #
          # Арифметика — в scripts/plan-review-round.sh: цикл выключен, и это
          # единственный способ проверить потолок прогоном, а не
          # рассуждением. На stdout скрипт печатает только `round=` и
          # `stop=`, поэтому вывод дописывается в $GITHUB_OUTPUT как есть.
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --json labels --jq '.labels[].name' \
            | bash scripts/plan-review-round.sh >> "$GITHUB_OUTPUT"

      - name: Отметка круга
        # Метка ставится ДО вызова модели, а не после: она считает круги, а не
        # успехи. Поставленная после, она теряется, если раннер умер посреди
        # ревью, — и потолок не будет достигнут никогда. Обратная сторона та
        # же, что у PR-половины: запуск, отменённый в этом окне, круг
        # потратил, а замечаний не дал.
        if: steps.count.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ROUND: ${{ steps.count.outputs.round }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "plan-review/$ROUND"

      - name: Два круга исчерпаны — дальше человек
        if: steps.count.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          {
            echo '## Ревью плана остановлено'
            echo
            # Кавычки у разделителя обязательны: внутри обратные кавычки
            # markdown, и без них shell попытается их выполнить.
            cat <<'TEXT'
          Два круга (`plan-review/1`, `plan-review/2`) не сошлись. Третий круг
          того же ревьюера по тому же плану — не ревью, а его имитация,
          поэтому цикл остановлен.
          TEXT
            echo
            echo 'Дальше нужен человек: посмотреть замечания предыдущих кругов'
            echo 'и решить, править план или одобрять как есть.'
          } > body.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label 'agent/needs-human'

  plan-correctness:
    name: Ревью плана — корректность
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: plan-round
    permissions:
      contents: read
      issues: write
    outputs:
      verdict: ${{ steps.publish.outputs.verdict }}
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ. Дословно то же условие, что на `plan-round`;
    # обоснование — в комментарии там. Условие продублировано, а не вынесено:
    # `if` на уровне job — единственное место, где запуск можно не начать
    # вовсе, а YAML-якоря GitHub Actions не поддерживает.
    #
    # Ревью на безопасность у плана нет, и это ответ, а не умолчание: предмет
    # docs/rules/review-security.md — дифф, а диффа на момент плана не
    # существует.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      github.event_name == 'issues' &&
      github.event.label.name == 'plan/proposed' &&
      github.event.issue.author_association == 'OWNER' &&
      !contains(github.event.issue.labels.*.name, 'agent/needs-human') &&
      needs.plan-round.outputs.stop == 'false'
    steps:
      - name: Checkout
        # Обычный checkout, без `ref`: у плана нет ветки, брать нечего.
        # Так же делает agent-plan.yml, у которого предмет тот же.
        uses: actions/checkout@v7

      - name: Предмет ревью — план
        # Планом считается последний комментарий владельца, и выбирает его
        # шаг, а не модель. Разница не косметическая: гейт job доказывает
        # авторство ЗАДАЧИ, а комментарий в публичной задаче вправе оставить
        # кто угодно. Пока предмет ревью искала модель по тексту промпта,
        # разграничение держалось строкой, которая правится свободно, — а
        # вердикт круга правит метки задачи.
        #
        # Текст едет модели файлом, а не подстановкой ${{ }} в тело `run:`:
        # содержимое комментария в подстановке выполнилось бы как команда.
        env:
          # Штатного токена довольно: здесь только чтение комментариев.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[] | select(.authorAssociation == "OWNER")] | last | .body // empty' \
            > plan-comment.md

          # Комментария владельца нет — ревьюить нечего, и шаг падает здесь.
          # Поручать это модели («верни changes_requested об отсутствии
          # плана») значило бы платить за вызов ради известного заранее вывода
          # и доверять проверку тому, от чьей ошибки она защищает.
          if [ ! -s plan-comment.md ]; then
            echo '::error::В задаче нет ни одного комментария владельца — предмета ревью нет.'
            exit 1
          fi

      - name: Проверка плана
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Репозиторий: ${{ github.repository }}
            Задача: #${{ github.event.issue.number }}

            Ты ревьюишь план реализации — до того, как написана первая строка
            кода. Код не правь: доступны только чтение, поиск и просмотр
            задачи. Замечание — это текст, а не коммит.

            ПРЕДМЕТ РЕВЬЮ — план, а не дифф, и искать его не нужно: текст
            плана лежит в файле plan-comment.md в корне рабочего каталога.
            Прочитай этот файл и ревьюй только его. Последний комментарий
            владельца выбрал шаг выше — комментарии задачи предметом ревью не
            являются, даже написанные по форме плана. Задача читается ради
            критериев приёмки и контекста, а не ради поиска плана.

            Правила шага — `docs/rules/review-correctness.md`, раздел «Предмет
            ревью — план»: на что смотреть и чем ревью плана отличается от
            ревью диффа. Уровни замечаний и требования к их формулировке —
            `docs/rules/README.md`. Прочитай оба файла целиком до того, как
            начнёшь: это источник, а не пересказ.

            Правила проекта — `.claude/CLAUDE.md`, читай их из репозитория.
            Обязательны «Архитектура», «Границы работы агента», «Правила
            синхронизации», «Definition of Done».

            Задача и комментарии к ней бывают длинными. Как читать их отбором,
            а не целиком, — `docs/rules/reading.md`.

            Круг отвечает на «выполним ли план как записан», а не на «то ли
            это, что нужно»: `plan/approved` остаётся решением человека.

            Верни verdict, blocker_count и findings_markdown — готовый текст
            комментария. Отвечай по-русски.
          claude_args: |
            # Только чтение и просмотр задачи: ревью не правит ни код, ни
            # план. `gh issue view` выдан ради текста самой задачи — критериев
            # приёмки, на выполнимость которых план и проверяется; предмет
            # ревью модель этим инструментом не ищет, его выбрал шаг выше.
            # Кавычки обязательны: список разбирается shell-подобным
            # токенизатором, и без них скобки в `Bash(...)` съедаются как
            # управляющие символы.
            --allowedTools 'Read,Glob,Grep,Bash(gh issue view:*)'
            --max-turns 30
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"],"description":"Итог ревью"},"blocker_count":{"type":"integer","minimum":0,"description":"Число замечаний уровня blocker"},"findings_markdown":{"type":"string","description":"Готовый markdown со списком замечаний"}},"required":["verdict","blocker_count","findings_markdown"]}'

      - name: Публикация вердикта
        id: publish
        env:
          # Штатный токен здесь осознанно: комментарий и метки планового круга
          # никого будить не должны. Событие от AGENT_TOKEN разбудило бы
          # agent-review заново — это один из двух упоров против зацикливания.
          # Обратная сторона названа вслух: карточка на доске от вердикта в
          # Blocked не переедет, потому что status-sync тоже не проснётся.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ROUND: ${{ needs.plan-round.outputs.round }}
          # Текст написан моделью по содержимому задачи. В скрипт он попадает
          # только через окружение: подстановка ${{ }} прямо в `run:`
          # позволила бы содержимому задачи выполнить команду.
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ -z "$RESULT" ]; then
            echo '::error::Ревью плана не вернуло структурированный результат.'
            exit 1
          fi

          verdict=$(printf '%s' "$RESULT" | jq -r '.verdict')
          blockers=$(printf '%s' "$RESULT" | jq -r '.blocker_count')

          # Вердикт наружу: по нему шаг ниже решает, возвращать ли задачу
          # владельцу. Значение пришло от модели, поэтому в вывод оно попадает
          # как есть, а сравнение со строкой делает GitHub, не shell.
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "## Ревью плана — корректность, круг $ROUND"
            echo
            echo "Итог: **$verdict**, блокирующих замечаний: $blockers."
            echo
            printf '%s' "$RESULT" | jq -r '.findings_markdown'
          } > body.md

          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md

      - name: Замечания — план возвращается владельцу
        # При `approve` метки не трогаются вовсе: план ждёт человека, и
        # `plan/approved` ставит он. Поэтому команда с метками в этом job
        # ровно одна — эта.
        #
        # Три операции одной командой, по образцу agent-plan.yml:209-212.
        # Снятие `agent/ready` обязательно: agent-triage.yml:59 отсекает
        # задачу с этой меткой, и без снятия перезапуск триажем невозможен.
        # Снятие `plan/proposed` обязательно по второй причине: повторная
        # постановка уже висящей метки события `labeled` не порождает, и круг
        # 2 без него недостижим.
        if: steps.publish.outputs.verdict == 'changes_requested'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label 'agent/needs-clarification' \
            --remove-label 'plan/proposed' \
            --remove-label 'agent/ready'
