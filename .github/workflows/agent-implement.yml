name: agent-implement

# Третий шаг цикла: план согласован человеком — можно писать код.
# Запускается меткой `plan/approved`, и только ею: единственная точка,
# где апрув человека превращается в изменение репозитория.
on:
  issues:
    types: [labeled]

# Единственный агентский workflow, которому действительно нужен
# contents: write — он создаёт ветку и пушит в неё.
# pull-requests: write — черновой PR; issues: write — метки прогресса.
#
# Права ниже относятся к штатному GITHUB_TOKEN. Пуш и создание PR идут
# через AGENT_TOKEN: событие от штатного токена не запускает CI.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  # Отмена на середине оставляет ветку в полузаписанном состоянии, поэтому
  # запуск доводится до конца, а повторный ждёт.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'

jobs:
  implement:
    name: Реализация задачи
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ.
    #
    # Репозиторий публичный, и это самый дорогой workflow цикла: он и платит
    # за модель, и пишет в репозиторий. Проверок две, потому что они закрывают
    # разное:
    #   * `github.actor == github.repository_owner` — метку `plan/approved`
    #     ставит человек, и здесь это именно тот человек, который её поставил.
    #     Ни один шаг цикла эту метку не ставит автоматически, так что
    #     проверка актора никакой штатный путь не ломает;
    #   * `github.event.issue.author_association == 'OWNER'` — задача заведена
    #     владельцем, а не посторонним.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА. Основной режим работы — задачу ведёт человек из
    # Claude CLI, а эти процессы лежат выключенными (docs/pipeline.md).
    # Без переменной запуск не начинается вовсе: отсутствие секрета его не
    # останавливает — процесс стартовал бы и упал на шаге вызова модели,
    # засоряя историю красными прогонами. Включение цикла — установка
    # `vars.AGENT_LOOP_ENABLED = true` плюс два секрета, и ничего больше.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (
        github.event.label.name == 'plan/approved' &&
        github.actor == github.repository_owner &&
        github.event.issue.author_association == 'OWNER'
      )
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          # Полная история: ветка задачи ответвляется от main, и агенту
          # нужен контекст предыдущих изменений.
          fetch-depth: 0

      - name: Установка .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Восстановление пакетов
        # Прогрев: агент не должен тратить ход на первую долгую загрузку.
        run: dotnet restore

      - name: Отметка «в работе»
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label 'agent/in-progress' \
            --remove-label 'plan/proposed'

      - name: Снимок открытых PR до шага модели
        # Признак «PR создан этим прогоном» не должен быть производным от
        # того, что выбирает модель. Имя ветки задаёт строка промпта, а
        # выбирает его тот же актор, у которого мы отнимаем право на метку, —
        # ветка, названная иначе, выпала бы из выборки молча.
        id: prs_before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="$(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
              --json number --jq '[.[].number] | sort | join(",")'
          )"
          printf 'numbers=%s\n' "$before" >> "$GITHUB_OUTPUT"

      - name: Реализация
        id: implement
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # AGENT_TOKEN обязателен именно здесь: пуш и создание PR,
          # сделанные штатным GITHUB_TOKEN, не порождают событий — CI на
          # ветке не запустится, а agent-fix, который следит за её
          # падениями, окажется недостижим.
          github_token: ${{ secrets.AGENT_TOKEN }}
          prompt: |
            Репозиторий: ${{ github.repository }}
            Задача: #${{ github.event.issue.number }}
            Базовая ветка: main

            Реализуй задачу по плану, согласованному в комментарии к ней.

            Правила шага — `docs/rules/implement.md`: порядок работы из восьми
            пунктов и запреты. Прочитай файл целиком до того, как начнёшь: это
            источник, а не пересказ.

            Правила проекта — `.claude/CLAUDE.md`, читай их из репозитория, а не
            по памяти. Обязательны к исполнению разделы «Архитектура», «Границы
            работы агента», «Запрещённые способы „починить“ сборку», «Правила
            синхронизации», «Git», «Журнал задачи», «Definition of Done».

            Вывод сборки и тестов бывает длинным. Как читать его отбором, а не
            целиком, — `docs/rules/reading.md`.

            Имя ветки: `feat/${{ github.event.issue.number }}-краткое-описание`.
            Журнал задачи: `docs/tasks/${{ github.event.issue.number }}.md`.
            Строка в теле PR: `Closes #${{ github.event.issue.number }}`.

            Отвечай по-русски.
          claude_args: |
            # Правка кода и ровно те команды, что нужны для цикла
            # «тест — код — проверка — коммит». `dotnet ef` не выдан
            # намеренно: миграции лежат в защищённых путях.
            # Кавычки обязательны: список разбирается shell-подобным
            # токенизатором, и без них скобки в `Bash(...)` съедаются как
            # управляющие символы — вместо ограничения получится мусор.
            --allowedTools 'Read,Glob,Grep,Edit,MultiEdit,Write,Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(git checkout:*),Bash(git switch:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr view:*)'
            --max-turns 80

      - name: Снятие меток-разрешений с PR, созданных этим прогоном
        # `gh pr create` выдан модели намеренно — черновой PR открывает она.
        # Но этот флаг граница `Bash(команда:*)` не разбирает, а
        # `gh pr create --label agent/allow-protected` не правит метки, а
        # рождает PR уже с разрешением: гейт целостности зеленеет, хотя
        # человек дифф не смотрел. Запрет ставится здесь, после модели,
        # потому что в списке инструментов его выразить нечем.
        #
        # Локально ту же дырку закрывает `scripts/step-bash-allow.sh`. Здесь
        # запрет посмертный, там предупредительный; разница — в записи 0018.
        #
        # Отбор — разность со снимком до шага, а не имя ветки: снимаем только
        # с PR, появившихся за этот прогон. Метку, поставленную человеком на
        # уже существующий PR, шаг не тронет — иначе повторный запуск
        # реализации отзывал бы согласие человека, печатая при этом
        # «разрешения ставит человек».
        #
        # Чего этот отбор не делает: PR, открытый человеком в те же минуты,
        # тоже считается новым. Признак «создан этим прогоном» независим от
        # модели, но не от времени.
        #
        # `always()`: если модель упала после создания PR, метка снимается тем
        # более — иначе разрешение висело бы на брошенной работе. Но при
        # неснятом снимке шаг падает, а не чистит наугад.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.prs_before.outputs.numbers }}
          BEFORE_OUTCOME: ${{ steps.prs_before.outcome }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_OUTCOME" != 'success' ]; then
            echo "Снимок открытых PR до шага не снят ($BEFORE_OUTCOME) — сравнивать не с чем, и чистить наугад нельзя." >&2
            exit 1
          fi
          # Присваивание, а не подстановка процесса в mapfile: pipefail её не
          # покрывает, и упавший `gh pr list` дал бы пустой список и зелёный
          # шаг — граница, не сработавшая без следа.
          after="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,labels)"
          rows="$(printf '%s' "$after" | jq -r --arg before "$BEFORE" '
            ($before | split(",") | map(select(length > 0))) as $known
            | .[]
            | (.number | tostring) as $num
            | select(($known | index($num)) == null)
            | .labels[].name as $label
            | select($label | startswith("agent/allow-"))
            | "\($num)\t\($label)"')"
          mapfile -t rows_arr <<< "$rows"
          for row in "${rows_arr[@]:-}"; do
            [ -z "$row" ] && continue
            pr="${row%%$'\t'*}"
            label="${row#*$'\t'}"
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "$label"
            echo "PR #$pr: снята метка $label — разрешения ставит человек, а не шаг."
          done

      - name: Снятие отметки «в работе»
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label 'agent/in-progress'

      - name: Остановка с объяснением
        # Реализация не доехала — задача возвращается человеку, а не висит
        # с меткой «в работе», по которой не видно, что работа встала.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo '## Реализация остановлена'
            echo
            echo "Запуск agent-implement завершился ошибкой: $RUN_URL"
            echo
            echo 'Дальше нужен человек. Метка agent/in-progress снята.'
          } > body.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh issue edit "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label 'agent/needs-human' \
            --remove-label 'agent/in-progress'
