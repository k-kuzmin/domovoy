name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление пакетов
        run: dotnet restore

      - name: Сборка
        # Предупреждение — это ошибка, которую пока не заметили:
        # TreatWarningsAsErrors включён в Directory.Build.props.
        run: dotnet build --configuration Release --no-restore

      - name: Проверка стиля
        run: dotnet format --verify-no-changes --no-restore

      - name: Тесты
        run: >-
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Результаты тестов как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Стек поднимается на примерах конфигурации
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Конфигурация из примеров, без правок
        # Ровно то, что делает человек на чистой машине (ТЗ 5.1.3).
        run: |
          set -euo pipefail
          cp .env.example .env
          cp config/entities.example.yaml         config/entities.yaml
          cp config/home-profile.example.md       config/home-profile.md
          cp config/proactive-rules.example.yaml  config/proactive-rules.yaml

      - name: Подъём стека
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Анонимный /health отвечает без секретов
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error http://localhost:8080/health)"
          echo "ответ: $body"
          echo "$body" | grep -qE '"status":"(healthy|degraded)"'

      - name: Эндпоинты API требуют аутентификации
        run: |
          set -euo pipefail
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8080/api/v1/state)"
          test "$code" = "401" || { echo "ожидался 401, получено $code"; exit 1; }

      - name: В логах старта нет секретов
        run: |
          set -euo pipefail
          docker compose logs api > api.log
          # Ищем значения, а не имена: DeviceToken и SourceContext в
          # логах законны, значение токена или пароля — нет.
          if grep -nE '(Bearer [A-Za-z0-9._-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.|Password=[^;$ ]{4,})' api.log; then
            echo '::error::В логах старта обнаружено похожее на секрет значение.'
            exit 1
          fi
          echo 'Секретов в логах старта нет.'

      - name: Логи как артефакт
        if: always()
        run: docker compose logs --no-color > compose-logs.txt || true

      - name: Выгрузка логов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Останов стека
        if: always()
        run: docker compose down --volumes
