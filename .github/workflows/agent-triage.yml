name: agent-triage

# Первый шаг агентского цикла: задача проверяется на пригодность к работе
# до того, как на неё потрачен хоть один платный вызов модели на реализацию.
# Триаж ничего не пишет в код — он читает репозиторий и возвращает вердикт.
on:
  issues:
    # `edited` намеренно отсутствует. Штатный ответ на уточняющие вопросы
    # триажа — комментарий, а не правка тела задачи, поэтому `edited` — это
    # в основном опечатки, и каждая покупала бы платный прогон. Прогнать
    # триаж заново после правки требований можно снятием и возвратом метки
    # `agent`: событие `labeled` для этого и есть.
    types: [opened, labeled]

# Минимум: читать код для проверки путей и писать метки с комментарием.
permissions:
  contents: read
  issues: read

concurrency:
  group: agent-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Триаж задачи
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ГЕЙТ ДОСТУПА — НЕ УДАЛЯТЬ.
    #
    # Репозиторий публичный. Событие `issues` порождает кто угодно: любой
    # человек может завести issue, и без этой проверки каждая такая issue
    # оплачивалась бы владельцем репозитория. `author_association == 'OWNER'`
    # для события `issues` относится к автору самой задачи — то есть к тому,
    # кто инициировал расход.
    #
    # Второе условие различает действие: без него добавление любой метки
    # (`area/api`, `priority/high`) к уже размеченной задаче запускало бы
    # триаж заново — тихая утечка бюджета.
    #
    # Третье: пройденный триаж не переигрывается. Метку `agent/ready`
    # снимает человек, если хочет прогнать заново.
    #
    # ВЫКЛЮЧАТЕЛЬ ЦИКЛА. Основной режим работы — задачу ведёт человек из
    # Claude CLI, а эти процессы лежат выключенными (docs/pipeline.md).
    # Без переменной запуск не начинается вовсе: отсутствие секрета его не
    # останавливает — процесс стартовал бы и упал на шаге вызова модели,
    # засоряя историю красными прогонами. Включение цикла — установка
    # `vars.AGENT_LOOP_ENABLED = true` плюс два секрета, и ничего больше.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (
        github.event.issue.author_association == 'OWNER' &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'agent') ||
          (github.event.action != 'labeled' &&
           contains(github.event.issue.labels.*.name, 'agent'))
        ) &&
        !contains(github.event.issue.labels.*.name, 'agent/ready')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Вердикт триажа
        id: verdict
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Модель здесь только читает и возвращает вердикт: писать в
          # репозиторий ей нечем и незачем.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Репозиторий: ${{ github.repository }}
            Задача: #${{ github.event.issue.number }}

            Ты проводишь триаж задачи перед тем, как её возьмёт агент.

            Правила шага — `docs/rules/triage.md`. Прочитай файл целиком до того,
            как начнёшь: это источник, а не пересказ. Правила проекта —
            `.claude/CLAUDE.md`, читай их из репозитория, а не по памяти: особенно
            разделы «Границы работы агента», «Definition of Done» и «Поведение при
            неопределённости».

            Триаж почти целиком состоит из чтения. Как читать объёмный вывод,
            не втягивая его целиком, — `docs/rules/reading.md`.

            Ничего не меняй: доступны только чтение и поиск.

            Ответ верни по json-схеме. Что означает каждое поле и при каком
            условии ставится ready=true — в `docs/rules/triage.md`.

            Отвечай по-русски.
          claude_args: |
            # Триаж только читает: ни Edit, ни Write, ни Bash.
            #
            # Модель названа явно и намеренно младшая: шаг сверяет задачу с
            # пятью проверяемыми пунктами и возвращает вердикт по схеме.
            # Это классификатор, а не суждение уровня плана или ревью, где
            # понижение покупалось бы качеством. Входа `model:` у действия
            # нет — только через claude_args.
            --model claude-haiku-4-5
            --allowedTools 'Read,Glob,Grep'
            --max-turns 15
            --json-schema '{"type":"object","properties":{"ready":{"type":"boolean","description":"Задача готова к работе агента"},"summary":{"type":"string","description":"Обоснование вердикта, одно-два предложения"},"questions":{"type":"string","description":"Markdown с уточняющими вопросами; пустая строка при ready=true"}},"required":["ready","summary","questions"]}'

      - name: Применение вердикта
        env:
          # AGENT_TOKEN, а не GITHUB_TOKEN. Метка, поставленная штатным
          # токеном рабочего процесса, не порождает событий: agent-plan не
          # проснулся бы на `agent/ready`, и цепочка оборвалась бы молча.
          # Это единственная причина, по которой здесь нужен PAT.
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          # Вердикт написан моделью. В `run:` он попадает только через
          # переменную окружения: подстановка ${{ }} прямо в текст скрипта
          # позволила бы содержимому задачи выполнить команду.
          VERDICT: ${{ steps.verdict.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ -z "$VERDICT" ]; then
            echo '::error::Триаж не вернул структурированный вердикт.'
            exit 1
          fi

          ready=$(printf '%s' "$VERDICT" | jq -r '.ready')
          printf '%s' "$VERDICT" | jq -r '.summary' > summary.md

          if [ "$ready" = 'true' ]; then
            gh issue edit "$ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label 'agent/ready' \
              --remove-label 'agent/needs-clarification'
            echo "Триаж пройден: $(cat summary.md)"
            exit 0
          fi

          {
            echo '## Триаж: нужны уточнения'
            echo
            cat summary.md
            echo
            printf '%s' "$VERDICT" | jq -r '.questions'
            echo
            # Кавычки у разделителя обязательны: внутри обратные кавычки
            # markdown, и без них shell попытается их выполнить.
            cat <<'FOOTER'
          Ответьте в комментарии и снимите метку `agent/needs-clarification`.
          FOOTER
          } > body.md

          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh issue edit "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label 'agent/needs-clarification' \
            --remove-label 'agent/ready'
