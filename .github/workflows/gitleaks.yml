name: gitleaks

# Дублирующий рубеж защиты (ТЗ REPO-2). Основной — pre-commit хук;
# этот срабатывает, если коммит сделали в обход хуков (--no-verify,
# веб-интерфейс GitHub, непроинициализированный клон).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Поиск секретов в истории
    runs-on: ubuntu-latest
    env:
      # Версия закреплена: обновление правил не должно ломать сборку
      # неожиданно. Поднимается отдельным коммитом.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Вся история: секрет мог попасть в любой коммит ветки.
          fetch-depth: 0

      - name: Установка gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # На pull_request правила берутся с базы, а не из ветки PR: иначе тот же
      # PR ослабляет .gitleaks.toml (или кладёт .gitleaksignore, или
      # gitleaks:allow на строке) и вносит секрет — и проверка зелёная.
      # Правка правил вступает в силу после мерджа. Базы без конфига нет:
      # шаг падает, а не откатывается на конфиг ветки. Запись 0026.
      - name: Проверка истории
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/gitleaks-rules"
          mkdir -p "$rules"
          extra=()
          if [ "$EVENT_NAME" = pull_request ]; then
            # .gitleaksignore из корня сканируемого каталога gitleaks читает
            # и при --gitleaks-ignore-path в другом месте — замер 8.30.1.
            # История от удаления из рабочего дерева не меняется.
            rm -f .gitleaksignore
            git fetch --no-tags origin "$BASE_REF"
            git show FETCH_HEAD:.gitleaks.toml > "$rules/config.toml"
            if git cat-file -e FETCH_HEAD:.gitleaksignore 2>/dev/null; then
              git show FETCH_HEAD:.gitleaksignore > "$rules/.gitleaksignore"
            fi
            extra+=(--ignore-gitleaks-allow)
          else
            cp .gitleaks.toml "$rules/config.toml"
            if [ -f .gitleaksignore ]; then cp .gitleaksignore "$rules/.gitleaksignore"; fi
          fi
          gitleaks git . \
            --config "$rules/config.toml" \
            --gitleaks-ignore-path "$rules" \
            ${extra[@]+"${extra[@]}"} \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Отчёт как артефакт
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7

  commit-messages:
    name: Сообщения коммитов
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Соавторство и подписи инструментов исключены
        run: |
          set -euo pipefail
          if git log --format='%B' | grep -nEi 'Co-Authored-By:|generated with|noreply@anthropic\.com|Claude Code'; then
            echo '::error::В истории есть трейлер соавторства или подпись инструмента. Соавторство в проекте исключено.'
            exit 1
          fi
          echo 'Чисто: трейлеров соавторства и подписей инструментов нет.'
