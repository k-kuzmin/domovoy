name: gitleaks

# Дублирующий рубеж защиты (ТЗ REPO-2). Основной — pre-commit хук;
# этот срабатывает, если коммит сделали в обход хуков (--no-verify,
# веб-интерфейс GitHub, непроинициализированный клон).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Поиск секретов в истории
    runs-on: ubuntu-latest
    env:
      # Версия закреплена: обновление правил не должно ломать сборку
      # неожиданно. Поднимается отдельным коммитом.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Вся история: секрет мог попасть в любой коммит ветки.
          fetch-depth: 0

      - name: Установка gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Проверка истории
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Отчёт как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7

  commit-messages:
    name: Сообщения коммитов
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Соавторство и подписи инструментов исключены
        run: |
          set -euo pipefail
          if git log --format='%B' | grep -nEi 'Co-Authored-By:|generated with|noreply@anthropic\.com|Claude Code'; then
            echo '::error::В истории есть трейлер соавторства или подпись инструмента. Соавторство в проекте исключено.'
            exit 1
          fi
          echo 'Чисто: трейлеров соавторства и подписей инструментов нет.'
