# ============================================================
# Шаблоны ответов — пример (FR-CORE-7)
#
# Успешное изменяющее действие формулируется шаблоном, повторный запрос
# к модели не выполняется. Это убирает из цепочки самый дорогой участок
# и сокращает латентность примерно вдвое.
#
# Отсутствие шаблона для пары «действие + домен» — не ошибка, а условие
# фолбэка на второй вызов модели. Доля запросов, закрытых одним раундом,
# отслеживается как метрика полноты этого файла (NFR-PERF-6).
#
# Падежи имени комнаты берутся из реестра сущностей.
# ============================================================

templates:
  light:
    turn_on: 'Включаю свет {{ area.prepositional }}.'
    turn_off: 'Выключаю свет {{ area.prepositional }}.'
    set_brightness: 'Ставлю яркость {{ value }} % {{ area.prepositional }}.'

  switch:
    turn_on: 'Включаю {{ entity_name }}.'
    turn_off: 'Выключаю {{ entity_name }}.'

  climate:
    turn_on: 'Включаю кондиционер {{ area.prepositional }}.'
    turn_off: 'Выключаю кондиционер {{ area.prepositional }}.'
    set_temperature: 'Ставлю {{ value }} градусов {{ area.prepositional }}.'

  script:
    run: 'Запускаю сценарий «{{ script_name }}».'

  # Для замков шаблона нет намеренно: действие проходит через
  # подтверждение, и ответ формулируется по его результату.
